name: Données, tests et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # le 4 de chaque mois à 05:23 UTC : le mois précédent est alors complet
    # et les séries Fama-French ont généralement été mises à jour.
    - cron: '23 5 4 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    # « shell: bash » active -o pipefail : un échec avant « | tee » fait échouer l'étape
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # versions exactes et empreintes SHA-256 (pipeline/requirements.txt, produit par pip-compile)
      - name: Dépendances Python (verrouillées)
        run: python -m pip install --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Tests du pipeline
        run: mkdir -p logs && python -m unittest discover -s pipeline/tests -t . -v 2>&1 | tee logs/pipeline-tests.log

      - name: Téléchargement et construction des données
        run: python -m pipeline.build 2>&1 | tee logs/data-build.log

      - name: Références statsmodels
        run: python -m pipeline.validate 2>&1 | tee logs/validate.log

      # Le rapport ne doit jamais bloquer la publication du site : en cas de panne
      # (miroirs apt, LaTeX), le PDF archivé dans le dépôt est conservé et une
      # alerte apparaît dans le résumé de l'exécution.
      - name: Installation de LaTeX (XeLaTeX, français, TeX Gyre) — paquets en cache
        id: latex1
        continue-on-error: true
        timeout-minutes: 10
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-french latexmk lmodern fonts-texgyre
          version: '1'
          execute_install_scripts: true

      - name: Test de compilation LaTeX
        id: check1
        continue-on-error: true
        run: bash .github/scripts/latex-smoke.sh

      - name: Installation de LaTeX — seconde tentative (apt direct)
        id: latex2
        if: steps.check1.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y -q --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-french latexmk lmodern fonts-texgyre

      - name: Vérification de LaTeX
        id: latex
        continue-on-error: true
        run: bash .github/scripts/latex-smoke.sh

      - name: Rapport de synthèse (LaTeX -> PDF)
        id: report
        if: steps.latex.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m pipeline.report 2>&1 | tee logs/report.log

      - name: Présentation vulgarisée du fonds (Beamer -> PDF)
        id: presentation
        if: steps.latex.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m pipeline.presentation 2>&1 | tee logs/presentation.log

      - name: Alerte si le rapport n'a pas été régénéré
        if: steps.latex.outcome != 'success' || steps.report.outcome != 'success' || steps.presentation.outcome != 'success'
        run: |
          git checkout -- public/report 2>/dev/null || true
          echo "::warning title=Rapport::Rapports non régénérés (LaTeX : ${{ steps.latex.outcome }}, rapport : ${{ steps.report.outcome }}, présentation : ${{ steps.presentation.outcome }}). Les versions archivées dans le dépôt sont publiées."

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # npm ci installe exactement package-lock.json et échoue s'il ne correspond pas à package.json
      - name: Dépendances Node (verrouillées)
        run: npm ci --no-audit --no-fund

      - name: Vérification des types
        run: npm run typecheck 2>&1 | tee logs/typecheck.log

      - name: Tests du moteur (dont comparaison à statsmodels)
        env:
          STRICT_REFERENCE: '1'
        run: npm test 2>&1 | tee logs/tests.log

      - name: Compilation du site
        run: npm run build 2>&1 | tee logs/build.log

      - name: Archivage des données dans le dépôt
        if: github.ref == 'refs/heads/main'
        run: |
          if python -m pipeline.changed; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data public/report data/processed tests/reference
            git commit -m "Données : mise à jour automatique [skip ci]" || exit 0
            git push
          else
            echo "Données inchangées : aucun commit."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Résumé des erreurs
        if: failure()
        run: |
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 40 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename $f)::$msg"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Sonde Raiffeisen (temporaire)
on:
  push:
    branches: [probe-raiffeisen]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -q requests yfinance pandas
      - run: python probe/probe.py

name: lock
on:
  push:
    branches: [probe-mm]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Python lock
        run: |
          python -m pip install -q pip-tools
          pip-compile --version
          pip-compile --generate-hashes --strip-extras --allow-unsafe --no-emit-index-url -o pipeline/requirements.txt pipeline/requirements.in
          python -m venv /tmp/v && /tmp/v/bin/pip install -q --require-hashes -r pipeline/requirements.txt && /tmp/v/bin/python -c "import pandas, numpy, scipy, statsmodels, yfinance, requests, matplotlib; print('imports ok', pandas.__version__, numpy.__version__, statsmodels.__version__)"
      - name: npm lock
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm ls --depth=0
      - name: Push locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f pipeline/requirements.txt package-lock.json
          git commit -m "locks [skip ci]"
          git push origin HEAD:probe-mm-locks --force
